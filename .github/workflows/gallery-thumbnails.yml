name: Galeri thumbnail olustur

on:
  push:
    paths:
      - "assets/gallery/**"
      - "scripts/build_gallery.py"
      - ".github/workflows/gallery-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow kur
        run: python -m pip install --upgrade pillow

      - name: Thumbnail ve gallery.json olustur
        run: python scripts/build_gallery.py

      - name: Uretilen dosyalari repoya kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery/thumbs assets/gallery/gallery.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "chore: update gallery thumbnails"
            git push
          fi
